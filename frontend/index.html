<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ƉEƉE - moteur d'audit de cybersécurité automatisé : cartographie de la surface exposée, détection de vulnérabilités et analyse par IA."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E1512" />
    <title>ƉEƉE - Audit de cybersécurité automatisé</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var fromQuery = params.get("theme");
          if (fromQuery === "light" || fromQuery === "dark") {
            localStorage.setItem("dede-theme", fromQuery);
          }
          var stored = localStorage.getItem("dede-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
